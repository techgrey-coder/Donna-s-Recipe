<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/styling/login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <title>Donna's Recipes</title>
</head>

<body>
    <div class="auth-container">
        <h1>Log In to <span style="color: #ca8ed6; font-family:sans-serif">Donna's Recipes</span></h1>
        <form id="login-form">
            <label for="email">Email:</label><br>
            <input type="email" id="email" name="email" autocomplete="on" placeholder="email" required><br>
            <label for="password">Password:</label><br>

            <div class="password-container">

                <input type="password" id="password" name="password" placeholder="Password" required>

                <i class="fas fa-eye" id="togglePassword"></i>
            </div>

            <br>
            <button type="submit">Log In</button>
        </form>
        <p>Don't have an account? <a href="/authentication/signup/signup.html">Sign Up</a></p>
        <div id="alert-box" class="alert" style="display:none;"></div>
    </div>
    <script src="/scripts/login.js"></script>
</body>

</html>
