<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/styling/signup.css">
    <title>Donna's Recipes</title>
</head>

<body>
    <div class="auth-container">
        <h1>Sign up to <span style="color: #ca8ed6; font-family:sans-serif">Donna's Recipes</span></h1>
        <form id="signup-form">
            <label for="username">Username:</label><br>
            <input type="text" id="username" name="username" autocomplete="on" placeholder="username" required><br>
            <label for="email">Email:</label><br>
            <input type="email" id="email" name="email" placeholder="email" required><br>
            <label for="password">Password:</label><br>
            <input type="password" id="password" name="password" placeholder="password" autocomplete="new-password" required><br>
            <label for="confirm-password">Confirm Password:</label><br>
            <input type="password" id="confirm-password" name="confirm-password" autocomplete="new-password" placeholder="confirm password"
                required>
            <button type="submit">Sign Up</button>
        </form>
        <p>Already have an account? <a href="/authentication/login/login.html">Log In</a></p>
        <div id="alert-box" class="alert" style="display:none;"></div>
    </div>
    <script src="/scripts/signup.js"></script>
</body>

</html>
